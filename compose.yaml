services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sweetwave
      POSTGRES_USER: sweetwave
      POSTGRES_PASSWORD: sweetwave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweetwave -d sweetwave"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./dev:/seed:ro
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/sweetwave-media;
      base64 -d /seed/demo-wave.wav.b64 > /tmp/demo-wave.wav;
      mc cp /tmp/demo-wave.wav local/sweetwave-media/samples/demo-wave.wav;
      mc anonymous set download local/sweetwave-media"

volumes:
  postgres-data:
  minio-data:
