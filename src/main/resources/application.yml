spring:
  application:
    name: sweetwave
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sweetwave}
    username: ${DB_USERNAME:sweetwave}
    password: ${DB_PASSWORD:sweetwave}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-before-deploying-1234567890}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:sweetwave-media}
    region: us-east-1
    presign-ttl-minutes: 10
